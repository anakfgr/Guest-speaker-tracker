<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Digital Platforms Arcade</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: product-page rhythm. Frosted top nav, big centred hero, generous tiles on a soft grey ground, one session per tab. */
:root {
  --ground: #fafafa;
  --card: #ffffff;
  --ink: #18181b;
  --muted: #6b6b73;
  --line: #e6e6ea;
  --soft: #f3f3f5;
  --accent: #d9480f;
  --accent-ink: #ffffff;
  --accent-soft: #fff0e6;
  --eyebrow: #d9480f;
  --good: #1f7a36;
  --good-soft: #e5f5ea;
  --bad: #c9001a;
  --bad-soft: #fdeaec;
  --nav: rgba(250, 250, 250, 0.82);
  --dark: #18181b;
  --dark-ink: #fafafa;
  --dark-muted: #a1a1aa;
  --g1: #ffb347; --g2: #ff6b4a; --g3: #f43f5e;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  --r-lg: 24px; --r-md: 16px; --r-sm: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0e0e10; --card: #19191c; --ink: #f5f5f6; --muted: #a1a1aa; --line: #2c2c30; --soft: #242428;
    --accent: #ff8a4c; --accent-ink: #111113; --accent-soft: #3a2216; --eyebrow: #ff9a5c;
    --good: #4cd96b; --good-soft: #10301a; --bad: #ff6b6b; --bad-soft: #3a1618; --nav: rgba(14, 14, 16, 0.8);
    --dark: #202024; --dark-ink: #fafafa; --dark-muted: #a1a1aa; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #0e0e10; --card: #19191c; --ink: #f5f5f6; --muted: #a1a1aa; --line: #2c2c30; --soft: #242428;
  --accent: #ff8a4c; --accent-ink: #111113; --accent-soft: #3a2216; --eyebrow: #ff9a5c;
  --good: #4cd96b; --good-soft: #10301a; --bad: #ff6b6b; --bad-soft: #3a1618; --nav: rgba(14, 14, 16, 0.8);
  --dark: #202024; --dark-ink: #fafafa; --dark-muted: #a1a1aa; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--ground); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.47; letter-spacing: -0.022em; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1024px; margin: 0 auto; padding-left: max(22px, env(safe-area-inset-left, 0px)); padding-right: max(22px, env(safe-area-inset-right, 0px)); }
h1, h2, h3, h4 { margin: 0; font-weight: 700; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; letter-spacing: inherit; color: inherit; cursor: pointer; }
button:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.grad { background: linear-gradient(90deg, var(--g1), var(--g2) 50%, var(--g3)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.eyebrow { color: var(--eyebrow); font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
.label { font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }

/* Global nav */
nav.global { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--nav); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--line); }
.navrow { display: flex; align-items: center; gap: 20px; height: 52px; }
.brand { font-weight: 700; font-size: 17px; white-space: nowrap; background: none; border: 0; padding: 0; }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1; }
.tabs > :first-child { margin-left: auto; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: 0 0 auto; border: 0; background: none; padding: 6px 12px; border-radius: 980px; font-size: 13px; color: var(--muted); white-space: nowrap; letter-spacing: -0.01em; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { background: var(--ink); color: var(--ground); }
.tab .soon { opacity: .6; }
@media (max-width: 640px) { .brand { display: none; } .tabs > :first-child { margin-left: 0; } }

main { padding-block: 0 80px; }
.panel[hidden] { display: none !important; }

/* Buttons */
.btn { border: 1px solid var(--line); background: var(--card); padding: 10px 20px; border-radius: 980px; font-size: 15px; font-weight: 500; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .4; cursor: not-allowed; filter: none; }
.btn.small { padding: 7px 14px; font-size: 14px; }
.link { border: 0; background: none; color: var(--accent); padding: 10px 4px; font-size: 17px; }
.link:hover { text-decoration: underline; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.spread { justify-content: space-between; }
.center { justify-content: center; }

/* Hero */
.hero { text-align: center; padding-block: clamp(56px, 10vw, 112px) clamp(40px, 6vw, 64px); display: flex; flex-direction: column; align-items: center; gap: 14px; }
.hero h1 { font-size: clamp(44px, 8.5vw, 92px); line-height: 1.04; letter-spacing: -0.045em; }
.hero .sub { font-size: clamp(19px, 2.4vw, 26px); color: var(--muted); max-width: 30ch; line-height: 1.3; letter-spacing: -0.02em; }
.hero .row { margin-top: 10px; }
.meter { width: min(320px, 100%); margin-top: 22px; display: grid; gap: 8px; }
.meter-row { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.track { height: 6px; background: var(--soft); border-radius: 99px; overflow: hidden; }
.fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--g1), var(--g2), var(--g3)); transition: width .5s ease; }

/* Tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.tile { background: var(--card); border-radius: var(--r-lg); padding: 28px; display: flex; flex-direction: column; gap: 8px; min-height: 230px; min-width: 0; border: 0; text-align: left; }
.tile h3 { font-size: 26px; letter-spacing: -0.03em; line-height: 1.12; }
.tile p { color: var(--muted); font-size: 15px; }
.tile .foot { margin-top: auto; padding-top: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.tile.feature { grid-column: 1 / -1; min-height: 340px; background: var(--dark); color: var(--dark-ink); padding: clamp(28px, 5vw, 56px); position: relative; overflow: hidden; justify-content: flex-end; }
.tile.feature::before { content: ""; position: absolute; inset: -40% -10% auto auto; width: 70%; aspect-ratio: 1; max-width: 100%; border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 94, 58, .6), rgba(244, 63, 94, .3) 45%, transparent 70%); filter: blur(10px); pointer-events: none; }
.tile.feature > * { position: relative; }
.tile.feature .eyebrow { color: #ff9a5c; }
.tile.feature h3 { font-size: clamp(32px, 5vw, 56px); letter-spacing: -0.04em; max-width: 14ch; }
.tile.feature p { color: var(--dark-muted); font-size: 17px; max-width: 46ch; }
.tile.feature .btn { background: var(--dark-ink); color: var(--dark); border-color: var(--dark-ink); }
.tile.feature .score { color: var(--dark-muted); font-size: 14px; }
.tile.soon h3 { color: var(--muted); }
.pill { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 99px; background: var(--soft); color: var(--muted); white-space: nowrap; }
.pill.done { background: var(--good-soft); color: var(--good); }
.section-title { font-size: clamp(28px, 4vw, 40px); letter-spacing: -0.035em; margin-bottom: 20px; }

/* Session */
.s-hero { text-align: center; padding-block: clamp(48px, 8vw, 88px) 36px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.s-hero h2 { font-size: clamp(38px, 7vw, 72px); line-height: 1.05; letter-spacing: -0.045em; max-width: 14ch; }
.s-hero .by { color: var(--muted); font-size: 19px; }
.gamecard { background: var(--card); border-radius: var(--r-lg); padding: clamp(20px, 4vw, 44px); min-width: 0; }
.gamecard-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; }
.gamecard-head h3 { font-size: clamp(26px, 3.4vw, 34px); letter-spacing: -0.035em; }
.duo { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; margin-top: 16px; }
@media (max-width: 760px) { .duo { grid-template-columns: 1fr; } }
.duo > div { background: var(--card); border-radius: var(--r-lg); padding: clamp(22px, 3.5vw, 36px); min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.duo h4 { font-size: 22px; letter-spacing: -0.03em; }
.takeaways { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 10px; font-size: 16px; }
.takeaways li::marker { color: var(--muted); font-weight: 600; }
textarea { width: 100%; min-height: 140px; resize: vertical; font: inherit; font-size: 16px; color: var(--ink); background: var(--soft); border: 1px solid transparent; border-radius: var(--r-sm); padding: 14px; }
textarea:focus { border-color: var(--accent); outline: none; }
.saved { font-size: 13px; color: var(--muted); min-height: 1.2em; }

/* Slides or games */
.choice { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.choose { background: var(--card); border: 0; border-radius: var(--r-lg); padding: clamp(18px, 3vw, 28px); text-align: left; display: flex; flex-direction: column; gap: 8px; min-width: 0; transition: transform .2s ease, box-shadow .2s ease; }
.choose:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0, 0, 0, .07); }
.choose h3 { font-size: clamp(26px, 3.4vw, 34px); letter-spacing: -0.035em; }
.choose p { color: var(--muted); font-size: 16px; }
.choose .art { aspect-ratio: 16 / 9; max-width: 100%; border-radius: var(--r-md); overflow: hidden; margin-bottom: 10px; background: var(--soft); }
.choose .art .slideimg { height: 100%; }
.choose .art.games { background: var(--dark); color: var(--dark-ink); display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; padding: 18px; position: relative; }
.choose .art.games::before { content: ""; position: absolute; inset: -30% -20% auto auto; width: 75%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, rgba(255, 94, 58, .6), rgba(244, 63, 94, .3) 45%, transparent 70%); }
.choose .art.games span { position: relative; font-size: clamp(15px, 2vw, 19px); font-weight: 600; letter-spacing: -0.02em; }
.choose .art.games span i { font-style: normal; color: var(--dark-muted); font-weight: 500; margin-right: 8px; font-variant-numeric: tabular-nums; }
.segrow { display: flex; justify-content: center; margin-bottom: 22px; }
.seg { display: inline-flex; background: var(--soft); border-radius: 980px; padding: 3px; }
.seg button { border: 0; background: none; padding: 8px 26px; border-radius: 980px; font-size: 15px; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 4px rgba(0, 0, 0, .14); }
.viewer { background: var(--card); border-radius: var(--r-lg); padding: clamp(12px, 3vw, 28px); min-width: 0; }
.screen { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: #000; border-radius: var(--r-md); overflow: hidden; touch-action: pan-y; }
.screen { display: grid; place-items: center; }
.slideimg { width: 100%; aspect-ratio: 16 / 9; max-width: 100%; background-repeat: no-repeat; background-color: #fff; }
.screen:fullscreen .slideimg { width: min(100vw, 177.78vh); }
.screen:fullscreen { border-radius: 0; }
.navbtn { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(0, 0, 0, .5); color: #fff; font-size: 24px; line-height: 1; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.navbtn.prev { left: 12px; } .navbtn.next { right: 12px; }
.navbtn:disabled { opacity: .2; cursor: default; }
.vbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin: 16px 0 14px; }
.count { font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
.count b { color: var(--ink); }
.thumbs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; }
.thumbs button { flex: 0 0 112px; aspect-ratio: 16 / 9; padding: 0; border: 2px solid transparent; border-radius: 9px; overflow: hidden; background: var(--soft); opacity: .7; }
.thumbs button:hover { opacity: 1; }
.thumbs button[aria-current="true"] { border-color: var(--accent); opacity: 1; }
.thumbs .slideimg { height: 100%; }
a.btn { text-decoration: none; color: inherit; display: inline-block; }
.tile.feature .btn.ghost { background: transparent; color: var(--dark-ink); border-color: rgba(250, 250, 250, .4); }

/* Coming soon */
.soon-panel { text-align: center; padding-block: clamp(80px, 16vw, 180px); display: flex; flex-direction: column; align-items: center; gap: 16px; }
.soon-panel h2 { font-size: clamp(52px, 10vw, 112px); letter-spacing: -0.05em; line-height: 1; }
.soon-panel p { color: var(--muted); font-size: 21px; max-width: 30ch; }

/* Shared game pieces */
.score-line { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.feedback { border-radius: var(--r-sm); padding: 14px 16px; font-size: 15.5px; }
.feedback.good { background: var(--good-soft); }
.feedback.bad { background: var(--bad-soft); }
.feedback b { display: block; margin-bottom: 2px; }
.feedback.good b { color: var(--good); }
.feedback.bad b { color: var(--bad); }
.q-text { font-size: clamp(21px, 2.6vw, 28px); font-weight: 600; letter-spacing: -0.03em; line-height: 1.2; margin: 8px 0 20px; }
.options { display: grid; gap: 10px; margin-bottom: 18px; }
.opt { text-align: left; padding: 15px 18px; border: 1px solid var(--line); background: var(--card); border-radius: var(--r-md); display: flex; gap: 14px; align-items: start; font-size: 16px; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt .k { font-size: 12px; font-weight: 700; color: var(--muted); background: var(--soft); border-radius: 6px; padding: 2px 7px; flex: 0 0 auto; margin-top: 2px; }
.opt.right { background: var(--good-soft); border-color: var(--good); }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
.opt:disabled { cursor: default; }
.result { text-align: center; padding: 28px 0 8px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.big { font-size: clamp(64px, 10vw, 96px); font-weight: 700; line-height: 1; letter-spacing: -0.05em; font-variant-numeric: tabular-nums; }
.result p { color: var(--muted); max-width: 44ch; }

/* Rounds */
.stagebar { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 28px; }
.stage { border: 1px solid var(--line); background: var(--card); border-radius: var(--r-md); padding: 14px 16px; text-align: left; display: flex; flex-direction: column; gap: 4px; }
.stage:hover { border-color: var(--ink); }
.stage[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.stage b { font-size: 17px; font-weight: 600; }
.stage .pill { align-self: flex-start; margin-top: 4px; }

/* Sort */
.pool { display: flex; flex-wrap: wrap; gap: 8px; min-height: 56px; padding: 14px; background: var(--soft); border-radius: var(--r-md); margin-bottom: 16px; }
.pool:empty::after { content: "All placed. Check your answers below."; color: var(--muted); font-size: 14px; align-self: center; }
.item { padding: 9px 14px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--card); font-size: 15px; font-weight: 500; text-align: left; touch-action: manipulation; user-select: none; }
.item:hover { border-color: var(--ink); }
.item[draggable="true"] { cursor: grab; }
.item.sel { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.item.right { background: var(--good-soft); border-color: var(--good); }
.item.wrong { background: var(--bad-soft); border-color: var(--bad); }
.bins { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 18px; }
.bin { border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px; background: var(--card); min-height: 170px; display: flex; flex-direction: column; gap: 8px; text-align: left; }
.bin.ready { border-color: var(--accent); border-style: dashed; }
.bin.over { background: var(--accent-soft); }
.bin h4 { font-size: 19px; letter-spacing: -0.02em; }
.bin h4.code { font-family: var(--mono); font-size: 16px; letter-spacing: 0; }
.bin small { color: var(--muted); font-size: 13.5px; }
.bin .items { display: flex; flex-wrap: wrap; gap: 6px; }
.explain { display: grid; gap: 6px; font-size: 15px; margin-top: 16px; }
.explain > div { padding: 10px 12px; border-radius: 10px; background: var(--soft); }

/* Order */
.seq { list-style: none; margin: 0 0 16px; padding: 0; display: grid; gap: 8px; }
.seq li { display: flex; gap: 12px; align-items: center; }
.seq .n { font-size: 13px; font-weight: 600; color: var(--muted); width: 20px; flex: 0 0 auto; text-align: right; font-variant-numeric: tabular-nums; }
.seq .slot { flex: 1; min-height: 46px; border: 1px dashed var(--line); border-radius: var(--r-sm); padding: 10px 14px; color: var(--muted); font-size: 14px; display: flex; align-items: center; }
.seq .step { flex: 1; text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: var(--r-sm); padding: 11px 14px; font-size: 15.5px; font-weight: 500; }
.seq .step.right { background: var(--good-soft); border-color: var(--good); }
.seq .step.wrong { background: var(--bad-soft); border-color: var(--bad); }

/* Memory, true/false, scenario (ready for future sessions) */
.mem { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
@media (max-width: 520px) { .mem { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.mcard { aspect-ratio: 4/3; max-width: 100%; border-radius: var(--r-md); border: 0; background: var(--ink); color: var(--ground); padding: 10px; display: grid; place-items: center; text-align: center; font-size: 13.5px; line-height: 1.3; }
.mcard .back { font-weight: 700; font-size: 22px; opacity: .5; }
.mcard.up { background: var(--card); color: var(--ink); box-shadow: inset 0 0 0 2px var(--accent); }
.mcard.term.up { font-weight: 600; font-size: 16px; }
.mcard.matched { background: var(--good-soft); color: var(--ink); cursor: default; }
.timer { height: 5px; background: var(--soft); border-radius: 99px; overflow: hidden; margin: 8px 0 4px; }
.timer i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--g1), var(--g2)); }
.tf { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
.tf .btn { padding: 16px; font-size: 19px; font-weight: 600; }
.meters { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 18px; }
@media (max-width: 520px) { .meters { grid-template-columns: 1fr; } }
.stat { background: var(--soft); border-radius: var(--r-md); padding: 12px 14px; }
.stat .v { font-weight: 700; font-size: 28px; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.delta { font-size: 13px; margin-left: 6px; } .delta.up { color: var(--good); } .delta.down { color: var(--bad); }

footer { padding-block: 22px 40px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>

<nav class="global" aria-label="Sessions">
  <div class="wrap navrow">
    <button class="brand" id="brand">Digital Platforms Arcade</button>
    <div class="tabs" role="tablist" id="tabs"></div>
  </div>
</nav>

<main id="panels"></main>

<footer>
  <div class="wrap row spread">
    <span>Digital Platforms · Guest speaker series. Scores and notes stay in this browser.</span>
    <span id="resetZone"></span>
  </div>
</footer>

<script>
/* =====================================================================
   SESSIONS. To add a new guest session, replace a { soon: true } entry
   with a full session object like the 9 Oct one.
   Game types: stages, order, sort, quiz, memory, truefalse, scenario.
   ===================================================================== */
const SESSIONS = [
  {
    id: "ll", n: 1, when: "9 Oct", short: "Vibe coding",
    speaker: "Nirvan, Yibo & Rishabh", org: "LaunchLab × ESSEC",
    topic: "Vibe coding: design, build, deploy.", gameName: "Ship It",
    blurb: "Claude Design, Claude Code, GitHub and Vercel. Revise the 31 slides, then play three rounds to lock in the full design → build → deploy loop.",
    slides: { dir: "slides/vibe-coding", count: 31, perSheet: 8, pdf: "slides/vibe-coding/vibe-coding-9-oct.pdf" },
    takeaways: [
      "Design the front end first in Claude Design, then use “Handoff to Claude Code…” in the Share menu to turn it into a working site.",
      "A strong prompt gives a role, goal, target audience, pages, design style and the output you expect.",
      "GitHub stores, shares and versions your code. Vercel turns a repo into a live site and redeploys on every push.",
      "Commit saves a snapshot locally, push uploads it, and a pull request asks teammates to review before merging.",
      "index.html holds the content, styles.css the look, script.js the behaviour.",
      "A static site forgets users and only knows its own files. A backend like Supabase adds logins and a database."

      h("h1", {}, "Learn it. ", h("span", { class: "grad" }, "Play it.")),
      h("p", { class: "sub" }, "Every guest session this semester, turned into a game."),
      h("div", { class: "row center" },
        h("button", { class: "btn primary", onclick: () => go(latest.id, null) }, "Open the latest session"),
        h("button", { class: "link", onclick: () => $("#sessions").scrollIntoView({ behavior: "smooth" }) }, "See all sessions ›")),
      h("div", { class: "meter", "aria-live": "polite" },
        h("div", { class: "meter-row" }, h("span", {}, "Sessions completed"), h("span", { id: "meterNum" }, "")),
        h("div", { class: "track" }, h("div", { class: "fill", id: "meterFill", style: "width:0%" })))),
    h("div", { class: "wrap", id: "sessions" }, h("h2", { class: "section-title" }, "The sessions."), h("div", { class: "tiles", id: "tiles" }))));
}
function drawTiles() {
  $("#tiles").replaceChildren(...SESSIONS.map(s => {
    if (s.soon) return h("button", { class: "tile soon", onclick: () => go(s.id) },
      h("div", { class: "label" }, `Session ${s.n}`), h("h3", {}, "Coming soon."), h("p", {}, "The game unlocks after the talk."),
      h("div", { class: "foot" }, h("span", { class: "pill" }, "Not yet held")));
    const p = progress[s.id];
    return h("div", { class: "tile feature" },
      h("div", { class: "eyebrow" }, `Session ${s.n} · ${s.when} · ${s.org}`),
      h("h3", {}, s.topic),
      h("p", {}, s.blurb),
      h("div", { class: "foot" },
        s.slides ? h("button", { class: "btn", onclick: () => go(s.id, "slides") }, "View slides") : null,
        h("button", { class: "btn" + (s.slides ? " ghost" : ""), onclick: () => go(s.id, "games") }, p && p.done ? "Play again" : "Play the games"),
        h("span", { class: "score" }, p && p.done ? `Best score ${p.best}%` : `${s.game.stages ? s.game.stages.length + " rounds" : "1 game"} · about 10 minutes`)));
  }));
}

function buildSession(s) {
  if (s.soon) {
    panelsEl.append(h("section", { class: "panel", id: "panel-" + s.id, role: "tabpanel", "aria-labelledby": "tab-" + s.id, hidden: true },
      h("div", { class: "wrap soon-panel" },
        h("div", { class: "eyebrow" }, `Session ${s.n}`),
        h("h2", { class: "grad" }, "Coming soon."),
        h("p", {}, "This guest session hasn't happened yet. Its game will appear here after the talk."),
        h("div", { class: "row center" }, h("button", { class: "btn primary", onclick: () => go(LIVE[0].id, null) }, `Open the ${LIVE[0].when} session`)))));
    return;
  }
  const box = h("div", { class: "game-box", "data-sid": s.id });
  const note = h("textarea", { id: "note-" + s.id, placeholder: "One idea from this talk I want to remember…" });
  note.value = store.get("note:" + s.id, "");
  const saved = h("div", { class: "saved", "aria-live": "polite" });
  let t; note.addEventListener("input", () => { clearTimeout(t); t = setTimeout(() => { store.set("note:" + s.id, note.value); saved.textContent = "Saved"; setTimeout(() => saved.textContent = "", 1500); }, 400); });
  const gameCard = h("div", { class: "gamecard" },
    h("div", { class: "gamecard-head" },
      h("div", {}, h("div", { class: "label" }, "The game"), h("h3", {}, s.gameName)),
      h("span", { class: "pill", "data-best": s.id }, "")),
    box);
  const viewer = s.slides ? buildViewer(s) : null;
  if (viewer) VIEWERS[s.id] = viewer;
  const rounds = s.game.stages ? s.game.stages.map(st => st.name) : [s.gameName];
  const choice = h("div", { class: "choice" },
    s.slides ? h("button", { class: "choose", onclick: () => setMode("slides") },
      h("div", { class: "art" }, paintSlide(h("div", { class: "slideimg" }), s.slides, 0)),
      h("div", { class: "label" }, `${s.slides.count} slides`), h("h3", {}, "Revise the slides."), h("p", {}, "Go back through the talk at your own pace.")) : null,
    h("button", { class: "choose", onclick: () => setMode("games") },
      h("div", { class: "art games" }, rounds.map((r, k) => h("span", {}, h("i", {}, String(k + 1).padStart(2, "0")), r))),
      h("div", { class: "label" }, rounds.length > 1 ? `${rounds.length} rounds` : "1 game"), h("h3", {}, "Play the games."), h("p", {}, "Test what you remember and beat your best score.")));
  const segBtns = (s.slides ? ["slides", "games"] : ["games"]).map(m => h("button", { "data-mode": m, "aria-pressed": "false", onclick: () => setMode(m) }, m === "slides" ? "Slides" : "Games"));
  const seg = h("div", { class: "segrow" }, h("div", { class: "seg", role: "group", "aria-label": "Slides or games" }, segBtns));
  function setMode(m, quiet) {
    mode[s.id] = m;
    choice.hidden = !!m; seg.hidden = !m;
    if (viewer) viewer.el.hidden = m !== "slides";
    gameCard.hidden = m !== "games";
    segBtns.forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === m));
    if (!quiet) setHash(s.id);
  }
  MODE_SET[s.id] = setMode;
  setMode(null, true);
  panelsEl.append(h("section", { class: "panel", id: "panel-" + s.id, role: "tabpanel", "aria-labelledby": "tab-" + s.id, hidden: true },
    h("div", { class: "wrap" },
      h("div", { class: "s-hero" },
        h("div", { class: "eyebrow" }, `Session ${s.n} · ${s.when}`),
        h("h2", {}, s.topic),
        h("p", { class: "by" }, `${s.speaker} · ${s.org}`)),
      choice, seg, viewer ? viewer.el : null, gameCard,
      h("div", { class: "duo" },
        h("div", {}, h("h4", {}, "Key takeaways."), h("ol", { class: "takeaways" }, s.takeaways.map(x => h("li", {}, x)))),
        h("div", {}, h("label", { for: "note-" + s.id }, h("h4", {}, "My reflection.")), note, saved)))));
  GAMES[s.game.type](box, s);
}

const mode = {}, MODE_SET = {}, VIEWERS = {};
// Slides are stored as a few tall "sheet" images (perSheet slides stacked top to bottom); show one slide by positioning the sheet.
function paintSlide(el, sl, k) {
  const per = sl.perSheet, sheet = Math.floor(k / per), rows = Math.min(per, sl.count - sheet * per), row = k - sheet * per;
  el.style.backgroundImage = `url("${sl.dir}/sheet-${sheet + 1}.jpg")`;
  el.style.backgroundSize = `100% ${rows * 100}%`;
  el.style.backgroundPosition = `0 ${rows > 1 ? row / (rows - 1) * 100 : 0}%`;
  return el;
}
function buildViewer(s) {
  const n = s.slides.count;
  let cur = Math.min(n - 1, store.get("slide:" + s.id, 0));
  const img = h("div", { class: "slideimg", role: "img" });
  const prev = h("button", { class: "navbtn prev", "aria-label": "Previous slide", onclick: () => step(-1) }, "‹");
  const next = h("button", { class: "navbtn next", "aria-label": "Next slide", onclick: () => step(1) }, "›");
  const screen = h("div", { class: "screen" }, img, prev, next);
  const count = h("div", { class: "count", "aria-live": "polite" });
  const thumbs = Array.from({ length: n }, (_, k) => h("button", { "aria-label": `Slide ${k + 1}`, onclick: () => show(k) }, paintSlide(h("div", { class: "slideimg" }), s.slides, k)));
  let x0 = null;
  screen.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
  screen.addEventListener("touchend", e => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) step(dx < 0 ? 1 : -1); x0 = null; });
  function show(k) {
    cur = Math.max(0, Math.min(n - 1, k));
    paintSlide(img, s.slides, cur); img.setAttribute("aria-label", `Slide ${cur + 1} of ${n}`);
    prev.disabled = cur === 0; next.disabled = cur === n - 1;
    count.replaceChildren("Slide ", h("b", {}, cur + 1), ` of ${n}`);
    thumbs.forEach((t, j) => t.setAttribute("aria-current", j === cur));
    thumbs[cur].scrollIntoView({ block: "nearest", inline: "nearest" });
    store.set("slide:" + s.id, cur);
  }
  function step(d) { show(cur + d); }
  const full = h("button", { class: "btn small", onclick: () => { const r = screen.requestFullscreen && screen.requestFullscreen(); if (r && r.catch) r.catch(() => {}); } }, "Full screen");
  const el = h("div", { class: "viewer", hidden: true }, screen,
    h("div", { class: "vbar" }, count, h("div", { class: "row" }, full, s.slides.pdf ? h("a", { class: "btn small", href: s.slides.pdf, download: "" }, "Download PDF") : null)),
    h("div", { class: "thumbs", "aria-label": "All slides" }, thumbs));
  show(cur);
  return { el, step };
}
document.addEventListener("keydown", e => {
  if ((e.target.closest && e.target.closest("textarea, input, .tabs")) || e.metaKey || e.ctrlKey || e.altKey) return;
  const id = store.get("tab", "home");
  if (mode[id] !== "slides" || !VIEWERS[id]) return;
  if (e.key === "ArrowRight" || e.key === "ArrowDown" || (e.key === " " && !(e.target.closest && e.target.closest("button")))) { e.preventDefault(); VIEWERS[id].step(1); }
  if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); VIEWERS[id].step(-1); }
});
function setHash(id) { try { history.replaceState(null, "", "#" + id + (mode[id] ? "/" + mode[id] : "")); } catch (e) {} }

function refreshStatus() {
  const done = LIVE.filter(s => progress[s.id] && progress[s.id].done).length;
  $("#meterNum").textContent = `${done} of ${LIVE.length} available`;
  $("#meterFill").style.width = (done / LIVE.length * 100) + "%";
  document.querySelectorAll("[data-best]").forEach(c => { const p = progress[c.dataset.best]; c.textContent = p && p.done ? `Best ${p.best}%` : "Not played"; c.classList.toggle("done", !!(p && p.done)); });
  drawTiles();
}

function go(id, m) {
  if (!ids.includes(id)) id = "home";
  if (MODE_SET[id] && m !== undefined) MODE_SET[id](m, true);
  document.querySelectorAll(".panel").forEach(p => p.hidden = p.id !== "panel-" + id);
  document.querySelectorAll(".tab").forEach(t => { const on = t.dataset.id === id; t.setAttribute("aria-selected", on); t.tabIndex = on ? 0 : -1; if (on) t.scrollIntoView({ block: "nearest", inline: "nearest" }); });

}
$("#brand").addEventListener("click", () => go("home"));
tabsEl.addEventListener("keydown", e => {
  if (!["ArrowRight", "ArrowLeft"].includes(e.key)) return;
  const cur = ids.indexOf(document.activeElement.dataset.id); if (cur < 0) return;
  const n = ids[(cur + (e.key === "ArrowRight" ? 1 : ids.length - 1)) % ids.length]; go(n); $("#tab-" + n).focus();
});

function resetButton() {
  const zone = $("#resetZone");
  zone.replaceChildren(h("button", { class: "btn small", onclick: () => zone.replaceChildren(h("span", { class: "row" }, "Clear all scores and notes?",
    h("button", { class: "btn small primary", onclick: () => { store.clear(); progress = {}; rebuild(); } }, "Yes, reset"),
    h("button", { class: "btn small", onclick: resetButton }, "Cancel"))) }, "Reset progress"));
}

function rebuild() {
  panelsEl.replaceChildren();
  buildTabs(); buildHome(); SESSIONS.forEach(buildSession); refreshStatus(); resetButton();
  const [hid, hm] = location.hash.replace("#", "").split("/");
  go(ids.includes(hid) ? hid : store.get("tab", "home"), ["slides", "games"].includes(hm) ? hm : null);
}
rebuild();
</script>
