<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Digital Platforms Ultra</title>
<meta name="description" content="A semester of guest talks run as a mountain race: each guest session is a checkpoint with its slides and revision games.">
<meta name="theme-color" content="#0b0f0e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Concept: the semester is a night trail race. Topographic map underlay, elevation profile as the home page,
   each guest session is a checkpoint (CP), the lecturer is the race director. One deliberate dark look. */
:root {
  --night: #0b0f0e;      /* ground */
  --ridge: #121917;      /* panels */
  --ridge-2: #18211e;    /* raised */
  --line: #283330;       /* hairlines */
  --ink: #eef1ec;        /* text */
  --muted: #95a39c;      /* secondary text */
  --flare: #ff5b1f;      /* trail-marker orange */
  --flare-ink: #160903;
  --moss: #b3dd46;       /* passed / correct */
  --moss-soft: rgba(179, 221, 70, .13);
  --bad: #ff7468;
  --bad-soft: rgba(255, 116, 104, .13);
  --paper: #f4f2ec;      /* race bib */
  --paper-ink: #111614;
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --r: 14px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--night); }
body { margin: 0; background: var(--night); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
#topo { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; opacity: .9; }
.page { position: relative; z-index: 1; }
.wrap { max-width: 1140px; margin: 0 auto; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
h1, h2, h3, h4 { margin: 0; font-family: var(--display); font-weight: 800; text-transform: uppercase; line-height: .92; letter-spacing: .005em; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--flare); outline-offset: 3px; }
.mono { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.flare { color: var(--flare); }
[hidden] { display: none !important; }

/* ---------- Top bar ---------- */
.bar { position: sticky; top: 0; z-index: 20; background: rgba(11, 15, 14, .82); -webkit-backdrop-filter: blur(14px) saturate(140%); backdrop-filter: blur(14px) saturate(140%); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
.barrow { display: flex; align-items: center; gap: 18px; height: 58px; }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; flex: 0 0 auto; }
.brand .tag { background: var(--flare); color: var(--flare-ink); font-family: var(--display); font-weight: 800; font-size: 17px; padding: 3px 7px 2px; border-radius: 4px; letter-spacing: .04em; }
.brand .nm { font-family: var(--display); font-weight: 700; font-size: 19px; text-transform: uppercase; letter-spacing: .03em; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
.tabs::-webkit-scrollbar { display: none; }
.tabs > :first-child { margin-left: auto; }
.tab { flex: 0 0 auto; border: 0; background: none; padding: 7px 11px; border-radius: 8px; color: var(--muted); font-family: var(--display); font-weight: 700; font-size: 16px; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; display: flex; align-items: center; gap: 7px; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); background: var(--ridge-2); box-shadow: inset 0 -2px 0 var(--flare); }
.tab .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.tab .dot.open { background: var(--flare); }
.tab .dot.done { background: var(--moss); }
.tab.locked { opacity: .5; }
@media (max-width: 720px) { .brand .nm { display: none; } .tabs > :first-child { margin-left: 0; } }

main { padding-bottom: 90px; }
.panel { animation: rise .45s ease both; }
@keyframes rise { from { opacity: .001; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* ---------- Buttons, pills ---------- */
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--ridge-2); color: var(--ink); padding: 11px 18px; border-radius: 10px; font-family: var(--display); font-weight: 700; font-size: 17px; text-transform: uppercase; letter-spacing: .05em; text-decoration: none; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--flare); border-color: var(--flare); color: var(--flare-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .35; cursor: not-allowed; filter: none; }
.btn.small { padding: 7px 12px; font-size: 15px; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.spread { justify-content: space-between; }
.center { justify-content: center; }
.pill { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; padding: 4px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill.done { color: var(--moss); border-color: rgba(179, 221, 70, .45); background: var(--moss-soft); }
.pill.open { color: var(--flare); border-color: rgba(255, 91, 31, .5); background: rgba(255, 91, 31, .1); }

/* ---------- Home hero ---------- */
.hero { padding-block: clamp(36px, 7vw, 84px) 26px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 30px 48px; align-items: end; }
@media (max-width: 860px) { .hero { grid-template-columns: 1fr; } }
.hero h1 { font-size: clamp(64px, 12.5vw, 172px); line-height: .84; letter-spacing: -.005em; }
.hero h1 .ultra { display: block; color: transparent; -webkit-text-stroke: 2px var(--flare); font-style: italic; }
.hero .lede { margin-top: 22px; max-width: 46ch; font-size: clamp(18px, 2vw, 21px); color: var(--ink); }
.hero .lede b { color: var(--flare); font-weight: 600; }
.hero .row { margin-top: 26px; }

/* Race bib */
.bib { position: relative; background: var(--paper); color: var(--paper-ink); width: min(300px, 100%); border-radius: 10px; padding: 22px 22px 18px; transform: rotate(2.5deg); box-shadow: 0 30px 60px rgba(0, 0, 0, .45); justify-self: end; }
@media (max-width: 860px) { .bib { justify-self: start; transform: rotate(-1.5deg); } }
.bib::before, .bib::after { content: ""; position: absolute; top: 12px; width: 10px; height: 10px; border-radius: 50%; background: var(--night); box-shadow: 0 calc(100% + 0px) 0 transparent; }
.bib::before { left: 12px; } .bib::after { right: 12px; }
.bib .pins { position: absolute; bottom: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; }
.bib .pins i { width: 10px; height: 10px; border-radius: 50%; background: var(--night); display: block; }
.bib .event { font-family: var(--display); font-weight: 800; font-size: 15px; letter-spacing: .12em; text-transform: uppercase; text-align: center; }
.bib .num { font-family: var(--display); font-weight: 800; font-size: 108px; line-height: .9; text-align: center; letter-spacing: -.02em; margin: 6px 0 4px; }
.bib .stripe { background: var(--flare); color: var(--flare-ink); font-family: var(--display); font-weight: 800; text-transform: uppercase; letter-spacing: .1em; text-align: center; font-size: 15px; padding: 5px 0 4px; border-radius: 4px; }
.bib .meta { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; margin: 10px 4px 14px; color: #4a524e; }

/* Stats */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-top: 8px; }
@media (max-width: 680px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat { padding: 16px 18px; border-right: 1px solid var(--line); min-width: 0; }
.stat:last-child { border-right: 0; }
@media (max-width: 680px) { .stat:nth-child(2) { border-right: 0; } .stat:nth-child(-n+2) { border-bottom: 1px solid var(--line); } }
.stat .v { font-family: var(--display); font-weight: 800; font-size: clamp(34px, 4.6vw, 52px); line-height: 1; font-variant-numeric: tabular-nums; margin-top: 4px; }
.stat .v small { font-size: .45em; color: var(--muted); font-weight: 700; margin-left: 4px; }

/* Elevation profile */
.profile { position: relative; margin-top: 34px; background: linear-gradient(180deg, rgba(18, 25, 23, .65), rgba(18, 25, 23, .95)); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 18px 12px; }
.profile-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
.plot { position: relative; height: clamp(190px, 26vw, 300px); }
.plot svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.plot .grid line { stroke: var(--line); stroke-width: 1; vector-effect: non-scaling-stroke; }
.plot .area { fill: url(#areaGrad); }
.plot .trace { fill: none; stroke: rgba(238, 241, 236, .35); stroke-width: 1.5; stroke-dasharray: 4 5; vector-effect: non-scaling-stroke; }
.plot .run { fill: none; stroke: var(--flare); stroke-width: 3; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.plot .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 2.2s cubic-bezier(.6, .05, .25, 1) .25s forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.cp { position: absolute; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: 0; padding: 0 0 4px; }
.cp .flag { font-family: var(--display); font-weight: 800; font-size: 15px; letter-spacing: .05em; padding: 3px 7px 2px; border-radius: 5px; background: var(--ridge-2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.cp .pole { width: 2px; height: 22px; background: var(--line); }
.cp.done .flag { background: var(--moss); border-color: var(--moss); color: var(--paper-ink); }
.cp.done .pole { background: var(--moss); }
.cp.open .flag { background: var(--flare); border-color: var(--flare); color: var(--flare-ink); }
.cp.open .pole { background: var(--flare); }
.cp.finish .flag { background: repeating-conic-gradient(var(--ink) 0 25%, var(--night) 0 50%) 0 0 / 10px 10px; color: transparent; width: 34px; }
.cp:hover .flag { transform: translateY(-2px); }
.cp .when { font-family: var(--mono); font-size: 10px; letter-spacing: .06em; color: var(--muted); text-transform: uppercase; white-space: nowrap; }
@media (max-width: 600px) { .cp .when { display: none; } .cp .flag { font-size: 13px; padding: 2px 5px 1px; } }
.runner { position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: var(--flare); box-shadow: 0 0 0 4px rgba(255, 91, 31, .25), 0 0 26px 6px rgba(255, 91, 31, .55); }
@media (prefers-reduced-motion: no-preference) { .runner { animation: lamp 2.2s ease-in-out infinite; } }
@keyframes lamp { 50% { box-shadow: 0 0 0 9px rgba(255, 91, 31, .08), 0 0 40px 12px rgba(255, 91, 31, .35); } }
.axis { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10.5px; color: var(--muted); margin-top: 8px; font-variant-numeric: tabular-nums; }

/* ---------- Section titles ---------- */
.sec { margin-top: clamp(56px, 8vw, 96px); }
.sec-head { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.sec-head h2 { font-size: clamp(40px, 6vw, 72px); }

/* Aid-station list */
.stations { border-top: 1px solid var(--line); }
.station { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 14px 22px; align-items: center; padding: 20px 4px; border-bottom: 1px solid var(--line); }
@media (max-width: 680px) { .station { grid-template-columns: 64px minmax(0, 1fr); } .station .acts { grid-column: 1 / -1; } }
.station .cpn { font-family: var(--display); font-weight: 800; font-size: clamp(40px, 6vw, 60px); line-height: .9; color: transparent; -webkit-text-stroke: 1.5px var(--muted); }
.station.done .cpn { -webkit-text-stroke-color: var(--moss); }
.station.open .cpn { -webkit-text-stroke-color: var(--flare); }
.station h3 { font-size: clamp(24px, 3vw, 32px); line-height: 1; }
.station .by { color: var(--muted); font-size: 15px; margin-top: 6px; }
.station .meta { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
.station.locked h3 { color: var(--muted); }
.station .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

/* Race director teaser */
.director { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 18px 26px; align-items: center; background: var(--ridge); border: 1px solid var(--line); border-radius: var(--r); padding: clamp(20px, 3vw, 30px); }
@media (max-width: 680px) { .director { grid-template-columns: 1fr; } }
.director .mono-badge { width: 74px; height: 74px; border-radius: 50%; display: grid; place-items: center; background: var(--paper); color: var(--paper-ink); font-family: var(--display); font-weight: 800; font-size: 34px; }

/* ---------- Session page ---------- */
.s-hero { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px 32px; align-items: end; padding-block: clamp(34px, 6vw, 70px) 26px; }
@media (max-width: 720px) { .s-hero { grid-template-columns: 1fr; } }
.s-hero .cpbig { font-family: var(--display); font-weight: 800; font-style: italic; font-size: clamp(110px, 18vw, 230px); line-height: .8; color: transparent; -webkit-text-stroke: 2px var(--flare); }
.s-hero.done .cpbig { -webkit-text-stroke-color: var(--moss); }
.s-hero h2 { font-size: clamp(42px, 6.6vw, 86px); }
.s-hero .by { color: var(--muted); font-size: 19px; margin-top: 12px; }
.s-hero .meta { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-bottom: 14px; }
.miniprof { height: 64px; position: relative; margin: 6px 0 26px; }
.miniprof svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.miniprof .mark { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--flare); }
.miniprof .mark::after { content: attr(data-l); position: absolute; top: -2px; left: 6px; font-family: var(--mono); font-size: 10.5px; color: var(--flare); white-space: nowrap; }

.choice { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 16px; }
.choose { position: relative; overflow: hidden; text-align: left; border: 1px solid var(--line); background: var(--ridge); border-radius: var(--r); padding: 0; display: flex; flex-direction: column; min-width: 0; transition: border-color .2s, transform .2s; }
.choose:hover { border-color: var(--flare); transform: translateY(-3px); }
.choose .art { aspect-ratio: 16 / 9; max-width: 100%; background: #000; position: relative; overflow: hidden; }
.choose .art .slideimg { height: 100%; opacity: .92; }
.choose .body { padding: 18px 20px 22px; display: flex; flex-direction: column; gap: 6px; }
.choose h3 { font-size: clamp(30px, 3.8vw, 42px); }
.choose p { color: var(--muted); font-size: 16px; }
.choose .art.games { display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; padding: 18px 20px; background: radial-gradient(120% 90% at 85% 10%, rgba(255, 91, 31, .35), transparent 60%), #0e1311; }
.choose .art.games span { font-family: var(--display); font-weight: 800; text-transform: uppercase; font-size: clamp(18px, 2.4vw, 24px); letter-spacing: .02em; }
.choose .art.games span i { font-style: normal; font-family: var(--mono); font-size: 12px; color: var(--flare); margin-right: 10px; vertical-align: 3px; }

.segrow { display: flex; justify-content: center; margin-bottom: 18px; }
.seg { display: inline-flex; background: var(--ridge); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
.seg button { border: 0; background: none; padding: 9px 22px; border-radius: 9px; font-family: var(--display); font-weight: 700; font-size: 17px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--flare); color: var(--flare-ink); }

.viewer, .gamecard { background: var(--ridge); border: 1px solid var(--line); border-radius: var(--r); padding: clamp(14px, 3vw, 30px); min-width: 0; }
.screen { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: #000; border-radius: 10px; overflow: hidden; display: grid; place-items: center; touch-action: pan-y; }
.slideimg { width: 100%; aspect-ratio: 16 / 9; max-width: 100%; background-repeat: no-repeat; background-color: #fff; }
.screen:fullscreen .slideimg { width: min(100vw, 177.78vh); }
.navbtn { position: absolute; top: 50%; transform: translateY(-50%); width: 46px; height: 46px; border-radius: 50%; border: 0; background: rgba(11, 15, 14, .7); color: #fff; font-size: 26px; line-height: 1; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.navbtn.prev { left: 12px; } .navbtn.next { right: 12px; }
.navbtn:disabled { opacity: .2; cursor: default; }
.vbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin: 16px 0 14px; }
.count { font-family: var(--mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.count b { color: var(--ink); }
.thumbs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; }
.thumbs button { flex: 0 0 112px; aspect-ratio: 16 / 9; padding: 0; border: 2px solid transparent; border-radius: 7px; overflow: hidden; background: #000; opacity: .55; }
.thumbs button:hover { opacity: 1; }
.thumbs button[aria-current="true"] { border-color: var(--flare); opacity: 1; }
.thumbs .slideimg { height: 100%; }

.gamecard-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }
.gamecard-head h3 { font-size: clamp(32px, 4vw, 44px); }

.duo { display: grid; grid-template-columns: 1.35fr 1fr; gap: 16px; margin-top: 16px; }
@media (max-width: 780px) { .duo { grid-template-columns: 1fr; } }
.duo > div { background: var(--ridge); border: 1px solid var(--line); border-radius: var(--r); padding: clamp(20px, 3vw, 30px); min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.duo h4 { font-size: 30px; }
.takeaways { margin: 0; padding-left: 0; list-style: none; counter-reset: t; display: flex; flex-direction: column; gap: 12px; font-size: 16px; }
.takeaways li { counter-increment: t; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 8px; }
.takeaways li::before { content: counter(t, decimal-leading-zero); font-family: var(--mono); font-size: 12px; color: var(--flare); padding-top: 4px; }
textarea { width: 100%; min-height: 150px; resize: vertical; font: inherit; font-size: 16px; color: var(--ink); background: var(--night); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
textarea:focus { border-color: var(--flare); outline: none; }
.saved { font-family: var(--mono); font-size: 11px; color: var(--moss); min-height: 1.2em; letter-spacing: .06em; text-transform: uppercase; }

/* Locked checkpoint + director page */
.locked-hero { text-align: center; padding-block: clamp(60px, 12vw, 140px) 40px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
.locked-hero .cpbig { font-family: var(--display); font-weight: 800; font-style: italic; font-size: clamp(120px, 22vw, 260px); line-height: .8; color: transparent; -webkit-text-stroke: 2px var(--line); }
.locked-hero h2 { font-size: clamp(40px, 6vw, 72px); }
.locked-hero p { color: var(--muted); font-size: 19px; max-width: 34ch; }
.tape { background: repeating-linear-gradient(135deg, var(--flare) 0 18px, var(--night) 18px 36px); height: 14px; width: min(520px, 100%); border-radius: 3px; opacity: .85; }

.dir-hero { padding-block: clamp(40px, 8vw, 90px) 20px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 30px; align-items: end; }
@media (max-width: 760px) { .dir-hero { grid-template-columns: 1fr; } }
.dir-hero h2 { font-size: clamp(76px, 14vw, 180px); line-height: .82; }
.dir-hero .role { font-size: clamp(19px, 2.2vw, 24px); margin-top: 16px; max-width: 40ch; }
.dir-hero .surname { display: block; font-style: italic; color: transparent; -webkit-text-stroke: 2px var(--flare); font-size: .52em; line-height: .95; margin-top: 6px; }
.dir-hero .bio { color: var(--muted); margin-top: 14px; max-width: 58ch; font-size: 17px; }
.dir-hero .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.badge { width: min(250px, 100%); background: var(--paper); color: var(--paper-ink); border-radius: 12px; padding: 18px; transform: rotate(-2deg); box-shadow: 0 30px 60px rgba(0, 0, 0, .45); }
.badge .top { background: var(--paper-ink); color: var(--paper); font-family: var(--display); font-weight: 800; letter-spacing: .14em; text-transform: uppercase; text-align: center; padding: 6px; border-radius: 6px; font-size: 15px; }
.badge .nm { font-family: var(--display); font-weight: 800; font-size: 46px; text-transform: uppercase; text-align: center; margin: 14px 0 4px; line-height: .9; }
.badge .sm { font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; text-align: center; color: #4a524e; }
.course-card { background: var(--ridge); border: 1px solid var(--line); border-radius: var(--r); padding: clamp(20px, 3vw, 30px); display: grid; gap: 14px; }
.course-card ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.course-card li { display: grid; grid-template-columns: 60px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding-bottom: 10px; border-bottom: 1px solid var(--line); }

  {
    id: "aimt", n: 2, when: "30 Oct", short: "AI marketing team",
    speaker: "Nick Goh", org: "Yellow Pages × ESSEC",
    topic: "Building an AI marketing team.", gameName: "Brief to Big Idea",
    blurb: "A lite agentic workflow with Claude: six AI roles take a brief all the way to scored key visuals, using a fictional Louis Vuitton “Terra” launch. Revise the 55 slides, then play three rounds.",

/* ===================== Storage (safe) ===================== */
const store = {
  get(k, d) { try { const v = localStorage.getItem("dpa:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("dpa:" + k, JSON.stringify(v)); } catch (e) {} },
  clear() { try { Object.keys(localStorage).filter(k => k.startsWith("dpa:")).forEach(k => localStorage.removeItem(k)); } catch (e) {} }
};
let progress = store.get("progress", {});
const PARENT = {};
LIVE.forEach(s => { if (s.game.type === "stages") s.game.stages.forEach((_, k) => PARENT[s.id + "-" + k] = s); });

function recordScore(id, pct, label) {
  const p = progress[id] || {};
  progress[id] = { done: true, best: Math.max(p.best || 0, pct), label: pct >= (p.best || 0) ? label : p.label };
  const parent = PARENT[id];
  if (parent) {
    const kids = parent.game.stages.map((_, k) => progress[parent.id + "-" + k]);
    if (kids.every(k => k && k.done)) progress[parent.id] = { done: true, best: Math.round(kids.reduce((a, k) => a + k.best, 0) / kids.length), label: "All rounds" };
  }
  store.set("progress", progress);
  refreshStatus();
}

/* ===================== Helpers ===================== */
const $ = (sel, root = document) => root.querySelector(sel);
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "html") el.innerHTML = v;
    else if (v !== false && v != null) el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false && kid !== "") el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
}
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

const CP_KM = [14, 31, 47, 62, 78, 90];   // where each checkpoint sits, in km
const COURSE_KM = 100;

/* Elevation (metres) along the course: rolling hills plus two big climbs. */
function elev(km) {
  const x = km * 10;
  return 950 + 230 * Math.sin(x / 70) + 150 * Math.sin(x / 31 + 1.3) + 90 * Math.sin(x / 17 + .4)
    + 520 * Math.exp(-(((x - 470) / 95) ** 2)) + 380 * Math.exp(-(((x - 780) / 70) ** 2)) - 160 * Math.exp(-(((x - 620) / 60) ** 2));
}
const SAMPLES = Array.from({ length: 201 }, (_, i) => { const km = i * COURSE_KM / 200; return { km, e: elev(km) }; });
const EMIN = Math.min(...SAMPLES.map(p => p.e)) - 120, EMAX = Math.max(...SAMPLES.map(p => p.e)) + 60;
const ex = km => km / COURSE_KM * 1000;
const ey = (e, H = 300, top = 70, bot = 18) => H - bot - (e - EMIN) / (EMAX - EMIN) * (H - top - bot);
function climbTo(km) { let d = 0; for (let i = 1; i < SAMPLES.length && SAMPLES[i].km <= km; i++) d += Math.max(0, SAMPLES[i].e - SAMPLES[i - 1].e); return Math.round(d / 10) * 10; }
const altAt = km => Math.round(elev(km) / 10) * 10;
const cpKm = s => CP_KM[s.n - 1];
const status = s => s.soon ? "locked" : (progress[s.id] && progress[s.id].done ? "done" : "open");
const fmt = n => n.toLocaleString("en-GB").replace(/,/g, " ");
function linePath(H, top, bot, toKm = COURSE_KM) {
  return SAMPLES.filter(p => p.km <= toKm + 1e-9).map((p, i) => `${i ? "L" : "M"}${ex(p.km).toFixed(1)},${ey(p.e, H, top, bot).toFixed(1)}`).join(" ");
}

          h("div", {}, h("div", { class: "mono" }, "Race director"), h("h3", { style: "font-size:clamp(34px,4.4vw,48px);margin-top:6px" }, LECTURER.name), h("p", { style: "color:var(--muted);margin-top:6px" }, LECTURER.role)),
          h("button", { class: "btn", onclick: () => go("director") }, "Meet the race director →"))))));
}

function drawProfile() {
  const plot = $("#plot"); if (!plot) return;
  const H = 300, top = 70, bot = 18;
  const reached = LIVE.filter(s => status(s) === "done").map(cpKm);
  const lastKm = reached.length ? Math.max(...reached) : 0;
  const ticks = [500, 1000, 1500, 2000].filter(e => e > EMIN && e < EMAX);
  plot.replaceChildren();
  plot.insertAdjacentHTML("beforeend", `<svg viewBox="0 0 1000 ${H}" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5b1f" stop-opacity=".22"/><stop offset="1" stop-color="#ff5b1f" stop-opacity="0"/></linearGradient>
    <clipPath id="runClip"><rect x="0" y="0" width="${ex(lastKm)}" height="${H}"/></clipPath></defs>
    <g class="grid">${ticks.map(e => `<line x1="0" x2="1000" y1="${ey(e, H, top, bot)}" y2="${ey(e, H, top, bot)}"/>`).join("")}</g>
    <path class="area" d="${linePath(H, top, bot)} L1000,${H} L0,${H} Z" clip-path="url(#runClip)"/>
    <path class="trace" d="${linePath(H, top, bot)}"/>
    ${lastKm > 0 ? `<path class="run draw" pathLength="1" d="${linePath(H, top, bot, lastKm)}"/>` : ""}
  </svg>`);
  ticks.forEach(e => plot.append(h("span", { class: "mono", style: `position:absolute;left:0;top:${ey(e, H, top, bot) / H * 100}%;transform:translateY(-120%);font-size:10px` }, fmt(e) + " m")));
  SESSIONS.forEach(s => {
    const km = cpKm(s), st = status(s);
    plot.append(h("button", { class: `cp ${st}`, style: `left:${ex(km) / 10}%;top:${ey(elev(km), H, top, bot) / H * 100}%`, onclick: () => go(s.id, null),
      "aria-label": `Checkpoint ${s.n}${s.soon ? ", not open yet" : ": " + s.topic}` },
      h("span", { class: "flag" }, `CP${s.n}`), h("span", { class: "when" }, s.soon ? "soon" : s.when), h("span", { class: "pole" })));
  });
  plot.append(h("button", { class: "cp finish", style: `left:99.2%;top:${ey(elev(COURSE_KM), H, top, bot) / H * 100}%`, "aria-label": "Finish line", onclick: () => $("#stations").scrollIntoView({ behavior: "smooth" }) },
    h("span", { class: "flag" }, "FIN"), h("span", { class: "when" }, "finish"), h("span", { class: "pole" })));
  plot.append(h("span", { class: "runner", style: `left:${ex(lastKm) / 10}%;top:${ey(elev(lastKm), H, top, bot) / H * 100}%`, title: "You are here" }));
  $("#legend").textContent = lastKm ? `You are at km ${lastKm} · ${fmt(altAt(lastKm))} m` : "On the start line";
}

function drawStats() {
  const done = LIVE.filter(s => status(s) === "done");
  const lastKm = done.length ? Math.max(...done.map(cpKm)) : 0;
  const avg = done.length ? Math.round(done.reduce((a, s) => a + progress[s.id].best, 0) / done.length) : null;
  const stat = (l, v, u) => h("div", { class: "stat" }, h("div", { class: "mono" }, l), h("div", { class: "v" }, v, u ? h("small", {}, u) : null));
  $("#stats").replaceChildren(
    stat("Distance", lastKm, `/ ${COURSE_KM} km`),
    stat("Elevation gain", fmt(climbTo(lastKm)), "m D+"),
    stat("Checkpoints", done.length, `/ ${SESSIONS.length}`),
    stat("Average score", avg == null ? "—" : avg, avg == null ? "" : "%"));
  $("#bibDplus").textContent = fmt(climbTo(COURSE_KM)) + " m D+";
  const next = LIVE.find(s => status(s) !== "done") || LIVE[LIVE.length - 1];
  const nb = $("#nextCp"); nb.textContent = LIVE.every(s => status(s) === "done") ? `Replay CP${next.n} →` : `Run CP${next.n} →`; nb.onclick = () => go(next.id, null);
}

function drawStations() {
  $("#stationList").replaceChildren(...SESSIONS.map(s => {
    const st = status(s), p = progress[s.id], km = cpKm(s);
    const tag = st === "done" ? h("span", { class: "pill done" }, `Passed · best ${p.best}%`) : st === "open" ? h("span", { class: "pill open" }, "Open") : h("span", { class: "pill" }, "Not open yet");
    return h("div", { class: `station ${st}` },
      h("div", { class: "cpn" }, "CP" + s.n),
      h("div", { style: "min-width:0" },
        h("div", { class: "meta" }, h("span", { class: "mono" }, `km ${km} · ${fmt(altAt(km))} m`), s.soon ? null : h("span", { class: "mono" }, s.when), tag),
        h("h3", {}, s.soon ? "Checkpoint closed" : s.topic.replace(/\.$/, "")),
        h("p", { class: "by" }, s.soon ? "Opens after the next guest talk." : `${s.speaker} · ${s.org}`)),
      h("div", { class: "acts" }, s.soon ? h("button", { class: "btn small", onclick: () => go(s.id, null) }, "Preview") : [
        s.slides ? h("button", { class: "btn small", onclick: () => go(s.id, "slides") }, "Slides") : null,
        h("button", { class: "btn small primary", onclick: () => go(s.id, "games") }, st === "done" ? "Race again" : "Games")]));
  }));
}

/* ---------- Mini profile for a checkpoint page ---------- */
function miniProfile(s) {
  const km = cpKm(s), wrap = h("div", { class: "miniprof" });
  wrap.insertAdjacentHTML("beforeend", `<svg viewBox="0 0 1000 64" preserveAspectRatio="none" aria-hidden="true"><path d="${linePath(64, 6, 2)} L1000,64 L0,64 Z" fill="rgba(255,91,31,.12)"/><path d="${linePath(64, 6, 2)}" fill="none" stroke="rgba(238,241,236,.4)" stroke-width="1.2" vector-effect="non-scaling-stroke"/></svg>`);
  wrap.append(h("span", { class: "mark", style: `left:${ex(km) / 10}%`, "data-l": `CP${s.n} · km ${km}` }));
  return wrap;
}

/* ---------- Slides viewer ---------- */
function paintSlide(el, sl, k) {
  const per = sl.perSheet, sheet = Math.floor(k / per), rows = Math.min(per, sl.count - sheet * per), row = k - sheet * per;
  el.style.backgroundImage = `url("${sl.dir}/sheet-${sheet + 1}.jpg")`;
  el.style.backgroundSize = `100% ${rows * 100}%`;
  el.style.backgroundPosition = `0 ${rows > 1 ? row / (rows - 1) * 100 : 0}%`;
  return el;
}
function buildViewer(s) {
  const n = s.slides.count;
  let cur = Math.min(n - 1, store.get("slide:" + s.id, 0));
  const img = h("div", { class: "slideimg", role: "img" });
  const prev = h("button", { class: "navbtn prev", "aria-label": "Previous slide", onclick: () => step(-1) }, "‹");
  const next = h("button", { class: "navbtn next", "aria-label": "Next slide", onclick: () => step(1) }, "›");
  const screen = h("div", { class: "screen" }, img, prev, next);
  const count = h("div", { class: "count", "aria-live": "polite" });
  const thumbs = Array.from({ length: n }, (_, k) => h("button", { "aria-label": `Slide ${k + 1}`, onclick: () => show(k) }, paintSlide(h("div", { class: "slideimg" }), s.slides, k)));
  let x0 = null;
  screen.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
  screen.addEventListener("touchend", e => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) step(dx < 0 ? 1 : -1); x0 = null; });
  function show(k) {
    cur = Math.max(0, Math.min(n - 1, k));
    paintSlide(img, s.slides, cur); img.setAttribute("aria-label", `Slide ${cur + 1} of ${n}`);
    prev.disabled = cur === 0; next.disabled = cur === n - 1;
    count.replaceChildren("Slide ", h("b", {}, cur + 1), ` / ${n}`);
    thumbs.forEach((t, j) => t.setAttribute("aria-current", j === cur));
    thumbs[cur].scrollIntoView({ block: "nearest", inline: "nearest" });
    store.set("slide:" + s.id, cur);
  }
  function step(d) { show(cur + d); }
  const full = h("button", { class: "btn small", onclick: () => { const r = screen.requestFullscreen && screen.requestFullscreen(); if (r && r.catch) r.catch(() => {}); } }, "Full screen");
  const el = h("div", { class: "viewer", hidden: true }, screen,
    h("div", { class: "vbar" }, count, h("div", { class: "row" }, full, s.slides.pdf ? h("a", { class: "btn small", href: s.slides.pdf, download: "" }, "Download PDF") : null)),
    h("div", { class: "thumbs", "aria-label": "All slides" }, thumbs));
  show(cur);
  return { el, step };
}
document.addEventListener("keydown", e => {
  if ((e.target.closest && e.target.closest("textarea, input, .tabs")) || e.metaKey || e.ctrlKey || e.altKey) return;
  const id = store.get("tab", "home");
  if (mode[id] !== "slides" || !VIEWERS[id]) return;
  if (e.key === "ArrowRight" || e.key === "ArrowDown" || (e.key === " " && !(e.target.closest && e.target.closest("button")))) { e.preventDefault(); VIEWERS[id].step(1); }
  if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); VIEWERS[id].step(-1); }
});

/* ---------- Checkpoint pages ---------- */
function buildSession(s) {
  const km = cpKm(s);
  if (s.soon) {
    panelsEl.append(h("section", { class: "panel", id: "panel-" + s.id, role: "tabpanel", hidden: true },
      h("div", { class: "wrap" },
        h("div", { class: "locked-hero" },
          h("div", { class: "cpbig" }, "CP" + s.n),
          h("div", { class: "mono" }, `km ${km} · ${fmt(altAt(km))} m`),
          h("h2", {}, "Checkpoint closed"),
          h("div", { class: "tape" }),
          h("p", {}, "This guest session hasn't happened yet. Its slides and games open here after the talk."),
          h("button", { class: "btn primary", onclick: () => go("home") }, "Back to the course")),
        miniProfile(s))));
    return;
  }
  const box = h("div", { class: "game-box", "data-sid": s.id });
  const note = h("textarea", { id: "note-" + s.id, placeholder: "What I'll remember from this checkpoint…" });
  note.value = store.get("note:" + s.id, "");
  const saved = h("div", { class: "saved", "aria-live": "polite" });
  let t; note.addEventListener("input", () => { clearTimeout(t); t = setTimeout(() => { store.set("note:" + s.id, note.value); saved.textContent = "Saved"; setTimeout(() => saved.textContent = "", 1500); }, 400); });
  const gameCard = h("div", { class: "gamecard" },
    h("div", { class: "gamecard-head" }, h("div", {}, h("div", { class: "mono" }, "Race the stage"), h("h3", { style: "margin-top:6px" }, s.gameName)), h("span", { class: "pill", "data-best": s.id }, "")),
    box);
  const viewer = s.slides ? buildViewer(s) : null;
  if (viewer) VIEWERS[s.id] = viewer;
  const rounds = s.game.stages ? s.game.stages.map(st => st.name) : [s.gameName];
  const choice = h("div", { class: "choice" },
    s.slides ? h("button", { class: "choose", onclick: () => setMode("slides") },
      h("div", { class: "art" }, paintSlide(h("div", { class: "slideimg" }), s.slides, 0)),
      h("div", { class: "body" }, h("div", { class: "mono" }, `Course recon · ${s.slides.count} slides`), h("h3", {}, "Revise the slides"), h("p", {}, "Walk back through the talk at your own pace."))) : null,
    h("button", { class: "choose", onclick: () => setMode("games") },
      h("div", { class: "art games" }, rounds.map((r, k) => h("span", {}, h("i", {}, `ST${k + 1}`), r))),
      h("div", { class: "body" }, h("div", { class: "mono" }, `Race the stage · ${rounds.length} round${rounds.length > 1 ? "s" : ""}`), h("h3", {}, "Play the games"), h("p", {}, "Test what you remember and beat your best score."))));
  const segBtns = (s.slides ? ["slides", "games"] : ["games"]).map(m => h("button", { "data-mode": m, "aria-pressed": "false", onclick: () => setMode(m) }, m === "slides" ? "Slides" : "Games"));
  const seg = h("div", { class: "segrow" }, h("div", { class: "seg", role: "group", "aria-label": "Slides or games" }, segBtns));
  function setMode(m, quiet) {
    mode[s.id] = m;
    choice.hidden = !!m; seg.hidden = !m;
    if (viewer) viewer.el.hidden = m !== "slides";
    gameCard.hidden = m !== "games";
    segBtns.forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === m));
    if (!quiet) setHash(s.id);
  }
  MODE_SET[s.id] = setMode;
  setMode(null, true);
  panelsEl.append(h("section", { class: "panel", id: "panel-" + s.id, role: "tabpanel", hidden: true },
    h("div", { class: "wrap" },
      h("div", { class: "s-hero", id: "hero-" + s.id },
        h("div", { class: "cpbig" }, "CP" + s.n),
        h("div", {},
          h("div", { class: "meta" }, h("span", { class: "mono" }, `${s.when} · km ${km} · ${fmt(altAt(km))} m`), h("span", { class: "pill", "data-status": s.id }, "")),
          h("h2", {}, s.topic.replace(/\.$/, "")),
          h("p", { class: "by" }, `${s.speaker} · ${s.org}`))),
      miniProfile(s),
      choice, seg, viewer ? viewer.el : null, gameCard,
      h("div", { class: "duo" },
        h("div", {}, h("h4", {}, "Race notes"), h("ol", { class: "takeaways" }, s.takeaways.map(x => h("li", {}, x)))),
        h("div", {}, h("label", { for: "note-" + s.id }, h("h4", {}, "My reflection")), note, saved)))));
  GAMES[s.game.type](box, s);
}

/* ---------- Race director ---------- */
function buildDirector() {
  const L = LECTURER;
  panelsEl.append(h("section", { class: "panel", id: "panel-director", role: "tabpanel", hidden: true },
    h("div", { class: "wrap" },
      h("div", { class: "dir-hero" },
        h("div", {},
          h("div", { class: "mono" }, "Race director"),
          h("h2", { style: "margin-top:12px" }, L.name, L.surname ? h("span", { class: "surname" }, L.surname) : null),
          h("p", { class: "role" }, L.role),
          L.bio ? h("p", { class: "bio" }, L.bio) : null,
          L.tags ? h("div", { class: "tags" }, L.tags.map(x => h("span", { class: "pill" }, x))) : null,
          L.link ? h("a", { class: "btn", href: L.link, target: "_blank", rel: "noopener", style: "margin-top:22px" }, "LinkedIn profile ↗") : null),
        h("div", { class: "badge" }, h("div", { class: "top" }, "Race director"), h("div", { class: "nm" }, L.name), h("div", { class: "sm" }, "Digital Platforms Ultra · ESSEC"))),
      h("div", { class: "course-card", style: "margin-top:34px" },
        h("div", { class: "row spread" }, h("h3", { style: "font-size:34px" }, "The course she set"), h("span", { class: "mono" }, `${LIVE.length} of ${SESSIONS.length} checkpoints open`)),
        h("ul", {}, SESSIONS.map(s => h("li", {}, h("b", {}, "CP" + s.n), h("span", { style: s.soon ? "color:var(--muted)" : "" }, s.soon ? "Opens after the talk" : `${s.topic.replace(/\.$/, "")} · ${s.speaker}`), h("span", { class: "mono" }, s.soon ? "—" : s.when)))),
        L.thanks ? h("p", { style: "font-size:19px;margin-top:6px" }, L.thanks) : null))));
}

/* ---------- Status, routing ---------- */
function refreshStatus() {
  document.querySelectorAll("[data-dot]").forEach(d => { const s = SESSIONS.find(x => x.id === d.dataset.dot); d.className = "dot " + status(s); });
  document.querySelectorAll("[data-best]").forEach(c => { const p = progress[c.dataset.best]; c.textContent = p && p.done ? `Best ${p.best}%` : "Not raced yet"; c.classList.toggle("done", !!(p && p.done)); });
  document.querySelectorAll("[data-status]").forEach(c => { const s = SESSIONS.find(x => x.id === c.dataset.status), st = status(s); c.textContent = st === "done" ? `Passed · best ${progress[s.id].best}%` : "Open"; c.className = "pill " + st; $("#hero-" + s.id)?.classList.toggle("done", st === "done"); });
  drawStats(); drawStations(); drawProfile();
}
function setHash(id) { try { history.replaceState(null, "", "#" + id + (mode[id] ? "/" + mode[id] : "")); } catch (e) {} }
function go(id, m) {
  if (!ids.includes(id)) id = "home";
  if (MODE_SET[id] && m !== undefined) MODE_SET[id](m, true);
  document.querySelectorAll(".panel").forEach(p => p.hidden = p.id !== "panel-" + id);
  document.querySelectorAll(".tab").forEach(t => { const on = t.dataset.id === id; t.setAttribute("aria-selected", on); t.tabIndex = on ? 0 : -1; if (on) t.scrollIntoView({ block: "nearest", inline: "nearest" }); });
  store.set("tab", id); setHash(id);
  if (id === "home") drawProfile();
  window.scrollTo({ top: 0 });
}
$("#brand").addEventListener("click", () => go("home"));
tabsEl.addEventListener("keydown", e => {
  if (!["ArrowRight", "ArrowLeft"].includes(e.key)) return;
  const cur = ids.indexOf(document.activeElement.dataset.id); if (cur < 0) return;
  const n = ids[(cur + (e.key === "ArrowRight" ? 1 : ids.length - 1)) % ids.length]; go(n); $("#tab-" + n).focus();
});
function resetButton() {
  const zone = $("#resetZone");
  zone.replaceChildren(h("button", { class: "btn small", onclick: () => zone.replaceChildren(h("span", { class: "row" }, "Clear all scores and notes?",
    h("button", { class: "btn small primary", onclick: () => { store.clear(); progress = {}; rebuild(); } }, "Yes, reset"),
    h("button", { class: "btn small", onclick: resetButton }, "Cancel"))) }, "Reset race"));
}
function rebuild() {
  panelsEl.replaceChildren();
  buildTabs(); buildHome(); SESSIONS.forEach(buildSession); buildDirector(); refreshStatus(); resetButton();
  const [hid, hm] = location.hash.replace("#", "").split("/");
  go(ids.includes(hid) ? hid : (hid === "madina" ? "director" : "home"), ["slides", "games"].includes(hm) ? hm : null);
}
rebuild();
</script>
